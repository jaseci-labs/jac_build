[project]
name = "jac_build"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.36.0"

[dev]
jaclang_source = "../../jac"

[jac-shadcn]
style = "nova"
baseColor = "zinc"
theme = "orange"
font = "geist"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

[dependencies]
[dependencies.npm]
"@hugeicons/react" = "^1.1.9"
"@hugeicons/core-free-icons" = "^4.2.3"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/geist" = "*"
"@fontsource-variable/geist-mono" = "latest"
lucide-react = "^0.469.0"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[serve]
base_route_app = "app"

[scale.microservices]
enabled = false

[client.app_meta_data]
title = "jac.build — the home for Jac builders"
description = "The persistent home of the Jac builders community: always-on hackathon cycles, living project profiles, checkpoints, and glow-ups. Where projects outlive the demo."
keywords = "jac, jaclang, jachacks, hackathon, builders, community, jaseci"
author = "Jaseci Labs"
theme_color = "#ff6b35"
og_title = "jac.build — the home for Jac builders"
og_description = "Always-on hackathon cycles, living project profiles, and glow-ups. Where projects outlive the demo."
og_type = "website"
og_url = "https://jac.build/"
og_site_name = "jac.build"
